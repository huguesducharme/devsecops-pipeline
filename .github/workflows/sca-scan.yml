name: SCA & SBOM (Trivy)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  trivy:
    name: Trivy Scanner & SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SBOM (CycloneDX format)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Send SBOM to DefectDojo
        run: |
          curl -X POST "${{ secrets.DOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DOJO_API_KEY }}" \
            -F "scan_type=CycloneDX Scan" \
            -F "file=@sbom.json" \
            -F "product_type_name=Pet Projects" \
            -F "product_name=devsecops-pipeline" \
            -F "engagement_name=Trivy SCA Scan" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'MEDIUM,HIGH,CRITICAL'
          exit-code: '1'
